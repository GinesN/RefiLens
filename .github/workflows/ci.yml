name: RefiLens checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ""
      DATABASE_URL: sqlite:///./data/ci.db
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 11.25.0
      - name: Fresh offline setup
        run: ./scripts/setup.sh
      - name: Python, frontend and production build checks
        run: ./scripts/check.sh
      - name: Install artifact verification dependencies
        run: python -m pip install -r scripts/portfolio/requirements.txt
      - name: Verify the included presentation assets
        run: python scripts/portfolio/verify.py
      - name: Install browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser flows against the production build
        run: |
          set -euo pipefail
          ./scripts/start.sh > /tmp/refilens-ci.log 2>&1 &
          refilens_server=$!
          trap 'kill "$refilens_server" 2>/dev/null || true' EXIT
          python scripts/wait_for_app.py
          pnpm --dir apps/web test:browser
