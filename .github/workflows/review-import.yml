name: Apply reviewed presentation cleanup
on:
  push:
    paths:
      - publication/review.tar.gz
      - .github/workflows/review-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify hashes and unpack the public source
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path.cwd()
          archive = root / "publication/review.tar.gz"
          if not archive.exists():
              raise SystemExit("No source snapshot to import.")
          with tarfile.open(archive, "r:gz") as tar:
              members = tar.getmembers()
              assert len({m.name for m in members}) == len(members), "Duplicate paths"
              manifest = json.load(tar.extractfile("PUBLICATION_MANIFEST.json"))
              assert manifest["format"] == 1
              assert {m.name for m in members} == set(manifest["files"]) | {"PUBLICATION_MANIFEST.json"}
              for name, info in manifest["files"].items():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] not in {".git", ".venv", "data", "output", "outputs", "tmp", "publication"}
                  assert not name.startswith(".github/workflows/")
                  assert path.name != ".env" and (not path.name.startswith(".env.") or path.name == ".env.example")
                  member = tar.getmember(name)
                  assert member.isfile() and member.size < 25_000_000
                  raw = tar.extractfile(member).read()
                  assert hashlib.sha256(raw).hexdigest() == info["sha256"], name
                  assert info["mode"] in [0o644, 0o755]
              for name, info in manifest["files"].items():
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(tar.extractfile(name).read())
                  target.chmod(info["mode"])
          print(f"Verified and unpacked {len(manifest['files'])} public source files.")
          PYTHON
      - name: Save the complete source and remove the transfer archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm publication/review.tar.gz
          git add --all
          git commit -m "Review financial evidence and clean project presentation"
          git push origin HEAD:main
